[project]
name = "assignment-planner"
version = "0.1.0"
description = "A simple personal assignment tracker"
default-app = "assignment-planner"

[apps.assignment-planner]
kind = "web-app"
entry-point = "main"

[apps.cli]
kind = "cli"
entry-point = "cli"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"
platform = "ios"

[apps.mobile.dependencies.npm]
react-native-web = "^0.21.0"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[client.app_meta_data]
title = "Assignment Planner"
description = "A simple personal assignment tracker"

[serve]
host = "127.0.0.1"
port = 8000
